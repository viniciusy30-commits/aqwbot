<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AQW</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:12px monospace;overflow:hidden}
body{display:flex;flex-direction:column}
#bar,#adv{padding:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:#1c1c24}
#adv{display:none}
input,select{background:#000;color:#ddd;border:1px solid #444;padding:4px}
#adv input{flex:1;min-width:140px}
button{padding:5px 9px}
#game{flex:1;min-height:0;background:#000;position:relative}
#wrap{position:absolute;left:0;top:0;transform-origin:0 0}
#game ruffle-player{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#log{display:none;height:30vh;overflow:auto;white-space:pre-wrap;padding:4px;border-top:1px solid #444;background:#111}
.e{color:#f77}.w{color:#fd5}
#meter{position:fixed;left:6px;bottom:4px;z-index:9;opacity:.6;font:11px monospace;color:#8f8;background:#0008;padding:2px 5px;border-radius:4px;pointer-events:none}
#sair{display:none;position:fixed;top:6px;right:6px;z-index:9;opacity:.45;padding:6px 10px}
body.fs #bar,body.fs #adv,body.fs #log{display:none!important}
body.fs #sair{display:block}
</style></head><body>
<div id="bar">
 <button id="fs">Tela cheia</button>
 <select id="q" title="Qualidade">
  <option value="low">Qualidade baixa (mais FPS)</option>
  <option value="medium">Qualidade média</option>
  <option value="high">Qualidade alta</option>
 </select>
 <select id="rend" title="Renderizador"><option value="wgpu-webgl">Renderizador: padrão</option><option value="webgpu">Renderizador: WebGPU (Vulkan)</option><option value="webgl">Renderizador: WebGL (OpenGL)</option><option value="canvas">Renderizador: Canvas</option></select>
 <select id="res" title="Resolução"><option value="auto">Resolução automática (recomendado)</option><option value="1">Resolução 100%</option><option value="0.75">Resolução 75%</option><option value="0.5">Resolução 50% (mais leve)</option><option value="0.35">Resolução 35% (bem leve)</option></select>
 <label><input type="checkbox" id="f30"> 30 FPS (experimental)</label>
 <button id="go">Recarregar</button>
 <button id="dg">Diagnóstico</button>
</div>
<div id="adv">
 <input id="swf" placeholder="URL do SWF (https://...)">
 <input id="sock" placeholder="sockets extras host:porta, separados por vírgula">
 <button id="fn">Funções</button>
 <input id="pth" placeholder="caminho (ex: world.myAvatar.dataLeaf.intHP)">
 <button id="rd">Ler</button> <button id="ky">Chaves</button> <button id="ds">Tipo</button> <button id="dp">Dump</button> <button id="pg">Cliente mod?</button>
 <button id="exp">Exportar arquivos do jogo</button>
 <button id="cap">Capturar pacotes: OFF</button>
 <button id="dsc">Descobrir</button>
</div>
<div id="game"><div id="wrap"></div></div>
<div id="log"></div>
<div id="meter"></div>
<button id="sair">✕ Sair da tela cheia</button>
<script>
var q=new URLSearchParams(location.search);
var PORT=q.get('port'),TOKEN=q.get('token');
var logEl=document.getElementById('log'),logOn=false,buf=[];
var NOISE=/focus_tracker|stub\.rs|library\.rs|Unknown device font|Focus is now/;
function hostLog(m,c){
  if(NOISE.test(m))return;
  m=String(m).replace(/%c/g,'').replace(/ color: [^ ]+; background: #444 color: gray; font-style: italic color: inherit/g,'');
  buf.push([m,c]);if(buf.length>300)buf.shift();
  if(logOn)draw(m,c);
}
function draw(m,c){var d=document.createElement('div');if(c)d.className=c;d.textContent=m;logEl.appendChild(d);while(logEl.childNodes.length>300)logEl.removeChild(logEl.firstChild);logEl.scrollTop=logEl.scrollHeight;}
['log','info','warn','error'].forEach(function(k){var o=console[k];console[k]=function(){try{hostLog('['+k+'] '+Array.prototype.slice.call(arguments).join(' '),k=='error'?'e':k=='warn'?'w':'');}catch(e){}o.apply(console,arguments);};});
window.addEventListener('error',function(e){hostLog('ERRO: '+e.message,'e');});
window.addEventListener('unhandledrejection',function(e){hostLog('PROMISE: '+e.reason,'e');});
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function $(i){return document.getElementById(i);}
var DEF_SWF='https://game.aq.com/game/gamefiles/Loader4.swf?ver=a';
$('swf').value=q.get('swf')||DEF_SWF;
$('sock').value=ls('sock')||'';
$('q').value=ls('quality')||'low';
$('f30').checked=ls('f30')==='1';
$('rend').value=ls('rend')||'wgpu-webgl';
$('res').value=ls('res2')||'1';
var STEPS=[1,0.85,0.7,0.55,0.4,0.3],stepI=1,lastDrop=0;
function curRes(){var v=$('res').value;return v==='auto'?STEPS[stepI]:(parseFloat(v)||1);}
function applyRes(){var r=curRes(),w=$('wrap');ls('res2',$('res').value);w.style.width=(r*100)+'%';w.style.height=(r*100)+'%';w.style.transform='scale('+(1/r)+')';}
applyRes();$('res').onchange=function(){applyRes();};
// Medidor + resolucao automatica: se o celular engasga (poucos quadros/s), baixa a resolucao; se folga por um bom tempo, sobe.
(function(){
  var n=0,t0=performance.now(),good=0;
  function tick(){
    n++;var t=performance.now();
    if(t-t0>=1000){
      var fps=Math.round(n*1000/(t-t0));n=0;t0=t;
      $('meter').textContent='fluidez '+fps+'/s | res '+Math.round(curRes()*100)+'%';
      if($('res').value==='auto'&&player){
        if(fps<28&&stepI<STEPS.length-1){stepI++;lastDrop=t;good=0;applyRes();hostLog('auto: baixei a resolucao para '+Math.round(STEPS[stepI]*100)+'%');}
        else if(fps>=57){good++;if(good>=15&&stepI>0&&t-lastDrop>30000){stepI--;good=0;applyRes();hostLog('auto: subi a resolucao para '+Math.round(STEPS[stepI]*100)+'%');}}
        else good=0;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
function viaProxy(u){var x=new URL(u);return location.origin+(x.protocol==='http:'?'/ph/':'/p/')+x.host+x.pathname+x.search;}
var player=null;
(function(){
  var of=window.fetch;
  function b64(buf){var u=new Uint8Array(buf),s='',i;for(i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
  function unb64(t){var s=atob(t),u=new Uint8Array(s.length),i;for(i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  window.fetch=function(input,init){
    try{
      var isReq=(typeof Request!=='undefined')&&input instanceof Request;
      var url=isReq?input.url:String(input);
      try{var ux=new URL(url);if(/(^|\.)aq\.com$/.test(ux.hostname)&&ux.origin!==location.origin){var pu=viaProxy(url);if(isReq){input=new Request(pu,input);isReq=true;}else{input=pu;}url=pu;}}catch(e){}
      var method=((init&&init.method)||(isReq&&input.method)||'GET').toUpperCase();
      if(method==='POST'&&window.AqwNative&&(url.indexOf(location.origin+'/p/')===0||url.indexOf(location.origin+'/ph/')===0)){
        var src=isReq?input.clone():null;
        var bodyP=(init&&init.body!==undefined&&init.body!==null)?new Response(init.body).arrayBuffer():(src?src.arrayBuffer():Promise.resolve(new ArrayBuffer(0)));
        var ct=new Headers((init&&init.headers)||(isReq?input.headers:undefined)).get('content-type')||'';
        return bodyP.then(function(buf){
          var r=JSON.parse(window.AqwNative.post(url,ct,b64(buf)));
          hostLog('POST '+url.replace(location.origin,'')+' -> '+r.status,r.status<400?'':'e');
          return new Response(unb64(r.body),{status:r.status,headers:r.type?{'content-type':r.type}:{}});
        });
      }
    }catch(e){hostLog('fetch hook: '+e,'e');}
    return of.call(this,input,init);
  };
})();
function defaultSocks(){var l=[],i,p;for(i=1;i<=40;i++)for(p=5588;p<=5600;p++)l.push('sock'+i+'.aq.com:'+p);return l.join(',');}
function proxies(){
  var typed=$('sock').value.trim();
  return (typed?typed+','+defaultSocks():defaultSocks()).split(',').map(function(s){return s.trim();}).filter(Boolean).map(function(hp){
    var i=hp.lastIndexOf(':');
    return {host:hp.substring(0,i),port:parseInt(hp.substring(i+1),10),proxyUrl:'ws://127.0.0.1:'+PORT+'/'+TOKEN+'/'+hp};
  });
}
function loadGame(){
  var swf=$('swf').value.trim();
  ls('swf',swf);ls('sock',$('sock').value);ls('quality',$('q').value);ls('rend',$('rend').value);ls('f30',$('f30').checked?'1':'0');
  if(!window.RufflePlayer){hostLog('Ruffle ainda não carregou','e');return;}
  var g=$('wrap');g.innerHTML='';applyRes();
  player=window.RufflePlayer.newest().createPlayer();g.appendChild(player);
  var url=/^https?:/.test(swf)?viaProxy(swf):swf;
  if($('f30').checked)url+=(url.indexOf('?')<0?'?':'&')+'aqwfps=30';
  hostLog('carregando '+url+' (qualidade '+$('q').value+')');
  player.load({url:url,autoplay:'on',unmuteOverlay:'hidden',allowScriptAccess:true,logLevel:'warn',
    quality:$('q').value,scale:'showAll',letterbox:'on',contextMenu:'off',showSwfDownload:false,
    splashScreen:false,preferredRenderer:$('rend').value,maxExecutionDuration:60,
    socketProxy:proxies(),parameters:{sLang:'',isweb:'true'}})
   .then(function(){hostLog('Jogo aceito pelo Ruffle');}).catch(function(e){hostLog('falha ao carregar: '+e,'e');});
}
function listFns(){
  if(!player){hostLog('sem jogo carregado','w');return;}
  var out=[];for(var k in player){try{if(typeof player[k]==='function'&&!(k in HTMLElement.prototype)&&!(k in Element.prototype))out.push(k);}catch(e){}}
  hostLog('Funções expostas no player ('+out.length+'): '+out.join(', '));
}
function discover(){
  fetch(viaProxy('https://game.aq.com/game/gamefiles/Loader4.swf?ver=a')).then(function(r){hostLog('TESTE do loader -> '+r.status,r.ok?'':'w');}).catch(function(e){hostLog('TESTE do loader: erro '+e,'e');});
}
function setFs(on){
  document.body.classList.toggle('fs',on);
  try{if(window.AqwNative)window.AqwNative.fullscreen(on);}catch(e){}
}
window.exitFs=function(fromApp){document.body.classList.remove('fs');if(!fromApp){try{window.AqwNative.fullscreen(false);}catch(e){}}};
$('fs').onclick=function(){setFs(true);};
$('sair').onclick=function(){setFs(false);};
$('go').onclick=loadGame;
$('fn').onclick=listFns;
$('exp').onclick=function(){try{window.AqwNative.exportFiles();}catch(e){hostLog('exportar: '+e,'e');}};
var capOn=false;
$('cap').onclick=function(){capOn=!capOn;try{window.AqwNative.capture(capOn);}catch(e){}$('cap').textContent='Capturar pacotes: '+(capOn?'ON':'OFF');hostLog(capOn?'captura ligada (>> enviado, << recebido)':'captura desligada');};
$('dsc').onclick=discover;
$('dg').onclick=function(){
  logOn=!logOn;
  $('adv').style.display=logOn?'flex':'none';
  logEl.style.display=logOn?'block':'none';
  if(logOn){logEl.innerHTML='';buf.forEach(function(x){draw(x[0],x[1]);});}
};

// ===== Cliente modificado: API para ler/comandar o jogo (funcoes injetadas no Game.swf) =====
window.aqw=(function(){
  function ok(){return !!(player&&typeof player.aqwGet==='function');}
  function chk(r){if(typeof r==='string'&&r.charAt(0)==='!')throw new Error(r.substring(1));return r;}
  return {
    ok:ok,
    ping:function(){return ok()?player.aqwPing():null;},
    get:function(p){return chk(player.aqwGet(p));},
    set:function(p,v){return chk(player.aqwSet(p,v));},
    call:function(p,args){return chk(player.aqwCall(p,args||[]));},
    keys:function(p){return chk(player.aqwKeys(p||''))||[];},
    desc:function(p){return chk(player.aqwDescribe(p||''));}
  };
})();
function aqwNeed(){if(!window.aqw.ok()){hostLog('Cliente modificado indisponível: entre no jogo até um mapa e confira "CLIENTE MOD" no log','w');return false;}return true;}
function fmtV(v){if(v===null||v===undefined)return 'null';var s=String(v);return s.length>120?s.substring(0,120)+'…':s;}
$('pg').onclick=function(){
  if(!window.aqw.ok()){hostLog('aqwGet NÃO existe no player (o jogo ainda não chegou ao ponto da injeção, ou a modificação não foi aplicada)','e');return;}
  hostLog('Cliente modificado ativo: '+window.aqw.ping());
};
$('rd').onclick=function(){if(!aqwNeed())return;var p=$('pth').value.trim();try{hostLog(p+' = '+fmtV(window.aqw.get(p)));}catch(e){hostLog(p+': '+e.message,'e');}};
$('ky').onclick=function(){if(!aqwNeed())return;var p=$('pth').value.trim();try{var k=window.aqw.keys(p);hostLog(p+' -> '+k.length+' chaves: '+k.join(', '));}catch(e){hostLog(p+': '+e.message,'e');}};
$('ds').onclick=function(){if(!aqwNeed())return;var p=$('pth').value.trim();try{var x=window.aqw.desc(p),n=[];var d=new DOMParser().parseFromString(x,'text/xml');
  var t=d.documentElement;hostLog(p+' é '+t.getAttribute('name')+' (base '+t.getAttribute('base')+')');
  ['variable','accessor','method'].forEach(function(tag){var a=[].slice.call(d.getElementsByTagName(tag)).map(function(e){return e.getAttribute('name')+(tag==='method'?'('+e.getElementsByTagName('parameter').length+')':'');});hostLog(tag+' ('+a.length+'): '+a.join(', '));});
 }catch(e){hostLog(p+': '+e.message,'e');}};
$('dp').onclick=function(){
  if(!aqwNeed())return;var L=[],A=window.aqw;
  function sec(t){L.push('');L.push('== '+t);}
  function dumpObj(p,max){
    var k;try{k=A.keys(p);}catch(e){L.push(p+': '+e.message);return;}
    L.push(p+' ('+k.length+' chaves)');
    k.slice(0,max||120).forEach(function(n){var v;try{v=A.get(p+'.'+n);}catch(e){v='!'+e.message;}L.push('  '+n+' = '+fmtV(v));});
  }
  L.push('AQW cliente modificado '+A.ping()+' - '+new Date().toISOString());
  ['world.strMapName','world.strAreaName','world.strFrame','world.curRoom','world.mapEntered','world.myAvatar.uid','world.myAvatar.isMyAvatar','world.myAvatar.pnm','world.myAvatar.target','world.myAvatar.npcType'].forEach(function(p){var v;try{v=A.get(p);}catch(e){v='!'+e.message;}L.push(p+' = '+fmtV(v));});
  sec('meu personagem');dumpObj('world.myAvatar.dataLeaf');dumpObj('world.myAvatar.objData');
  sec('monstros (world.monsters)');var mk=[];try{mk=A.keys('world.monsters');}catch(e){L.push('keys: '+e.message);}
  L.push('quantidade de chaves: '+mk.length+' | length='+fmtV((function(){try{return A.get('world.monsters.length');}catch(e){return '?';}})()));
  mk.slice(0,3).forEach(function(k){dumpObj('world.monsters.'+k,60);});
  sec('monstros da cela (getMonstersByCell)');try{var r=A.call('world.getMonstersByCell',[]);L.push('retorno: '+fmtV(r));}catch(e){L.push(e.message);}
  sec('arvores de dados');['world.monTree','world.uoTree','world.invTree','world.questTree'].forEach(function(p){var k;try{k=A.keys(p);L.push(p+': '+k.length+' chaves: '+k.slice(0,40).join(', '));}catch(e){L.push(p+': '+e.message);}});
  sec('alvo');dumpObj('world.myAvatar.target.dataLeaf',60);
  var txt=L.join('\n');
  try{window.AqwNative.saveText('dump-cliente.txt',txt);}catch(e){hostLog('salvar dump: '+e,'e');}
  hostLog('Dump gerado: '+L.length+' linhas. Toque em "Exportar arquivos do jogo" e me envie o ZIP.');
};
window.RufflePlayer=window.RufflePlayer||{};
window.RufflePlayer.config={polyfills:false,autoplay:'on',unmuteOverlay:'hidden',logLevel:'warn'};
var sc=document.createElement('script');sc.src='https://unpkg.com/@ruffle-rs/ruffle';
sc.onload=function(){hostLog('Ruffle carregado');loadGame();};
sc.onerror=function(){hostLog('Ruffle NÃO carregou (sem internet?)','e');};
document.head.appendChild(sc);
</script></body></html>
